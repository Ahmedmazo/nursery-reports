<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقارير الحضانة اليومية</title>
<style>
:root{--bg:#fbf7f2;--card:#fff;--ink:#2e2a26;--muted:#8a8078;--accent:#e08a5b;--accent2:#7bab8a;--border:#ece3d8;}
@media (prefers-color-scheme: dark){:root{--bg:#211d1a;--card:#2b2622;--ink:#f1ece5;--muted:#a89e93;--border:#3a342e;}}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',Tahoma,Arial,sans-serif;}
.app{max-width:1000px;margin:0 auto;padding:16px;}
header.top{position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
header.top h1{font-size:1.1rem;margin:0;color:var(--accent);}
.pill{font-size:.75rem;background:var(--card);border:1px solid var(--border);padding:4px 10px;border-radius:20px;color:var(--muted);}
button{cursor:pointer;border:none;border-radius:10px;padding:9px 14px;font-size:.9rem;font-family:inherit;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--card);color:var(--ink);border:1px solid var(--border);}
input,select,textarea{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--ink);font-family:inherit;font-size:.9rem;}
label{font-size:.8rem;color:var(--muted);display:block;margin:10px 0 4px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.grid{display:grid;grid-template-columns:1fr 1.6fr;gap:14px;}
@media (max-width:760px){.grid{grid-template-columns:1fr;}}
.report-item{padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent;}
.report-item:hover{background:var(--bg);}
.report-item.active{border-color:var(--accent);background:var(--bg);}
.report-item .name{font-weight:600;}
.report-item .meta{font-size:.75rem;color:var(--muted);}
.badge{background:var(--accent2);color:#fff;font-size:.7rem;padding:2px 7px;border-radius:10px;}
.reply{background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:.85rem;}
.reply .who{font-weight:600;font-size:.78rem;color:var(--accent);}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.empty{color:var(--muted);text-align:center;padding:30px 10px;}
.tabs{display:flex;gap:8px;margin-bottom:12px;}
.tab{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:.85rem;}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
@media print{body *{visibility:hidden;}#printArea,#printArea *{visibility:visible;}#printArea{position:absolute;top:0;right:0;left:0;padding:20px;}}
</style>
</head>
<body>
<div class="app" id="app"><div class="empty">جارِ التحميل…</div></div>
<div id="printArea" style="display:none"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
